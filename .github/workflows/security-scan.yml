name: Security scan

# Vulnerability scanning of every production dependency set (backend
# Python, web and mobile npm) — weekly and on every push to main
# (docs/SECURITY_POLICY.md §6: critical/high findings are patched within
# the defined SLA). Production servers are managed PaaS (Railway, Vercel,
# Supabase), whose OS/runtime patching is handled by those providers.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --progress-spinner off || true
      - run: pip-audit -r backend/requirements.txt --progress-spinner off --strict --vulnerability-service osv -f markdown > pip-audit.md || true
      - uses: actions/upload-artifact@v4
        with: { name: pip-audit, path: pip-audit.md }

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [frontend/web, frontend/mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.app }}
        continue-on-error: true
