name: Backend tests

# Runs the full backend pytest suite on every push/PR — the automatic
# check Diego asked for after the Aug 15 real-money incident (silent,
# unlogged AI spend from a worker self-heal bug), so a regression of that
# exact failure mode (see tests/test_undervalued_screener_batch.py's
# TestBatchFailureNeverFallsBackToRealClaudeCalls and
# TestStartupSelfHealNeverTriggersAISpendForBacktestAlone) fails loudly in
# CI instead of silently reaching production.
#
# Caveat, stated plainly: this does NOT stop Railway from auto-deploying a
# push to main — Railway deploys on push regardless of this workflow's
# result unless a separate "wait for CI" integration is configured on
# Railway's side. What this DOES guarantee: every push gets a visible,
# unambiguous pass/fail signal on GitHub within minutes, and pytest exits
# non-zero (failing this check) the instant either regression test above
# would fail.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      SUPABASE_URL: http://localhost
      SUPABASE_ANON_KEY: dummy
      SUPABASE_SERVICE_KEY: dummy
      SECRET_KEY: ci-test-only-not-a-real-secret-0000000000
      ANTHROPIC_API_KEY: sk-ant-dummy-ci-key
      CLAUDE_MODEL: claude-haiku-4-5-20251001
      FRONTEND_URL: "*"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q
