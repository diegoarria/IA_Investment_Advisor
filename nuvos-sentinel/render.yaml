services:
  - type: web
    name: nuvos-sentinel
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NUVOS_BACKEND_URL
        sync: false
      - key: NUVOS_WEB_URL
        sync: false
      - key: SENTINEL_SHARED_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ALERT_PHONE_NUMBER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: SENTINEL_DASHBOARD_USER
        sync: false
      - key: SENTINEL_DASHBOARD_PASSWORD
        sync: false
    disk:
      name: sentinel-data
      mountPath: /opt/render/project/src
      sizeGB: 1
